name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, aws]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: nix shell nixpkgs#nodejs_24 --command bash -c 'npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run check'
